name: Master Publish
run-name: ${{ gitea.actor }} is publishing Vistta.JS
on:
  push:
    branches:
      - master
jobs:
  Explore-Gitea-Actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v3
        with:
          node-version: '19.x'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm config set @vistta:registry https://git.vistta.me/api/packages/vistta/npm/
      - run: npm config set -- '//git.vistta.me/api/packages/vistta/npm/:_authToken' "${{ secrets.NPM_TOKEN }}"
      - run: npm publish