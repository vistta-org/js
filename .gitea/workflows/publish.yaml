name: Publish
run-name: ${{ gitea.actor }} is publishing Vistta.JS
on:
  push:
    branches:
      - master
jobs:
  Publish-Actions:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        if: ${{ steps.version-type.outputs.action != 'skip' }}
        uses: actions/checkout@v3
      -
        name: Check Commit Message
        id: check-commit
        run: |
          commitMessage=$(git log -1 --pretty=format:%s ${{ github.sha }})
          echo "::set-output name=commit-message::$commitMessage"
      -
        name: Perform Action
        run: |
          echo "Commit message is present: ${{ steps.check-commit.outputs.commit-message }}"
