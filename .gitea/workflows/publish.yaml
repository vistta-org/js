name: Publish
run-name: ${{ gitea.actor }} is publishing Vistta.JS
on:
  push:
    branches:
      - master
jobs:
  Publish-Actions:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v3
      -
        name: Check Release
        id: release
        run: |
          commitMessage="$(git log -1 --pretty=format:%s ${{ github.sha }})"
          if [[ $commitMessage == "Patch"* ]]; then
            echo "::set-output name=version::patch"
          elif  [[ $commitMessage == "Minor"* ]]; then
            echo "::set-output name=version::minor"
          elif  [[ $commitMessage == "Major"* ]]; then
            echo "::set-output name=version::major"
          elif  [[ $commitMessage == "Release"* ]]; then
            echo "::set-output name=version::release"
          else
            echo "::set-output name=version::skip"
          fi
      -
        name: Setup
        if: ${{ steps.release.outputs.version != 'skip' }}
        uses: actions/setup-node@v3
        with:
          node-version: '19.x'
          registry-url: 'https://registry.npmjs.org'
      -
        name: Install
        if: ${{ steps.release.outputs.version != 'skip' }}
        run: npm ci
      -
        name: Node Version
        if: ${{ steps.release.outputs.version != 'skip' }}
        id: version
        run: |
          version="${{ steps.release.outputs.version }}"
          if [[ $version == "release" ]]; then
            result=${npm pkg get version}
          else
            git config user.email "devops@vistta.me"
            git config user.name "devops"
            result=$(npm version ${{ steps.release.outputs.version }} --git-tag-version --allow-same-version)
          fi
          echo "::set-output name=number::$result"
      - 
        name: Git Version
        if: ${{ steps.release.outputs.version != 'skip' }}
        run: |
          echo Version: ${{ steps.version.outputs.number }}"
