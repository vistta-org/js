name: Publish
run-name: ${{ gitea.actor }} is publishing Vistta.JS
on:
  pull_request:
    types:
      - closed
    branches:    
      - master
jobs:
  Publish-Actions:
    if: gitea.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
      with:
        ref: ${{ gitea.event.pull_request.base.ref }}
        token: ${{ secrets.GIT_TOKEN }}
    -
      name: Check Release
      id: release
      run: |
        if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Patch') }}" == "true" ]]; then
          echo "::set-output name=version::patch"
        elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Minor') }}" == "true" ]]; then
          echo "::set-output name=version::minor"
        elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Major') }}" == "true" ]]; then
          echo "::set-output name=version::major"
        elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Auto') }}" == "true" ]]; then
          echo "::set-output name=version::auto"
        else
          echo "::set-output name=version::skip"
        fi
    -
      name: Install
      if: ${{ steps.release.outputs.version != 'skip' }}
      run: |
        npm config set @vistta:registry https://git.vistta.me/api/packages/vistta/npm/
        npm config set -- '//git.vistta.me/api/packages/vistta/npm/:_authToken' "${{ secrets.GIT_TOKEN }}"
        npm ci
    -
      name: Node Version
      if: ${{ steps.release.outputs.version != 'skip' }}
      id: version
      run: |
        version="${{ steps.release.outputs.version }}"
        git config user.email "release@vistta.me"
        git config user.name "VisttaJS Release"
        if [[ $version == "auto" ]]; then
          git tag "v$(npm pkg get version)"
        else
          result=$(npm version ${{ steps.release.outputs.version }} --git-tag-version --allow-same-version)
        fi
        git push --tags
        git push origin ${{ gitea.event.pull_request.base.ref }} --force
    - 
      name: Node Publish
      if: ${{ steps.release.outputs.version != 'skip' }}
      run: npm publish