name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    container:
      image: git.vistta.me/vistta/vistta-runner:latest
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v3
      - 
        name: NPM Setup
        run: npm i & npm link
      - 
        name: Validations
        run: npm run validation
      - 
        name: Unit Tests
        run: |
          npx puppeteer browsers install chrome
          npm run test