name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
       -
        name: deploy        
        if:      
        run: |
          if [[contains(${{github.event.pull_request.labels.*.name}}, 'Release/Patch')]]; then
            echo "patch"
          elif [[contains(${{github.event.pull_request.labels.*.name}}, 'Release/Minor')]]; then
            echo "minor"
          elif [[contains(${{github.event.pull_request.labels.*.name}}, 'Release/Major')]]; then
            echo "major"
          elif [[contains(${{github.event.pull_request.labels.*.name}}, 'Release/Manual')]]; then
            echo "manual"
          else
            echo "skip"
          fi
          echo "deploy"
