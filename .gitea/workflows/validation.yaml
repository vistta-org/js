name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
      -
        name: Test
        run: |
          containsRelease=false
          for label in "${{ github.event.pull_request.labels[@] }}"; do
            echo "Label: $label"
            if [[ $label == *"Release"* ]]; then
              containsRelease=true
              break
            fi
          done

          echo "Contains Release Label: $containsRelease"
