          echo "The labels on the pull request are: ${{ github.event.label.name }}"
          if [[ "label1" == "${{ github.event.label.name }}" ]]; then
            echo "Performing action for label1"
            # Add your specific actions for label1
          elif [[ "label2" == "${{ github.event.label.name }}" ]]; then
            echo "Performing action for label2"
            # Add your specific actions for label2
          else
            echo "No matching label found"
          fi
