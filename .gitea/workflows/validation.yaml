name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v3
      - 
        name: Node Setup
        uses: actions/setup-node@v3
        with:
          node-version: '21.x'
          registry-url: 'https://registry.npmjs.org'
      - 
        name: NPM Setup
        run: npm ci
      - 
        name: Validations
        run: npm run validation
      - 
        name: Unit Tests
        run: npm run test