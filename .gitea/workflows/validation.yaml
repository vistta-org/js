name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
      -
        name: Loop through labels
        run: |
          labels="${{ toJson(gitea.event.pull_request.labels) }}"
          IFS='},{'
          read -ra label_arr <<< "$labels"
          for label in "${label_arr[@]}"; do
            label="${label%]*}"
            label="${label#*[}"
            name="${label#*\"name\":\"}"
            name="${name%%\"*}"
            if [[ $name == Release/* ]]; then
              rest="${name#Release/}"
              echo "Label: $name, Extracted: $rest"
            fi
          done
