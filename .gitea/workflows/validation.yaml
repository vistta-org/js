name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
      -
        name: Loop through labels
        run: |
          labels="${{ toJson(gitea.event.pull_request.labels) }}"
          while IFS= read -r line; do
            name=$(echo "$line" | grep -o '"name": *"[^"]*"' | cut -d '"' -f 4)
            if [[ $name == Release/* ]]; then
              rest=${name#Release/}
              echo "Label: $name, Extracted: $rest"
            fi
          done <<< "$labels"
