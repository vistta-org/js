name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Print branch names
        run: |
          echo "Target branch: ${{ env.GITEA_REF }}"
          echo "Source branch: ${{ env.GITEA_HEAD_REF }}"