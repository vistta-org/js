name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v3
      with:
        ref: ${{ gitea.event.pull_request.base.ref }}
        token: "9a62c99f1da9d4417fd2c396e5fba566a868bfbe"
    -
      name: Check Release
      id: release
      run: |
        if [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Patch') }}" == "true" ]]; then
          echo "::set-output name=version::patch"
        elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Minor') }}" == "true" ]]; then
          echo "::set-output name=version::minor"
        elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Major') }}" == "true" ]]; then
          echo "::set-output name=version::major"
        elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'Release/Manual') }}" == "true" ]]; then
          echo "::set-output name=version::manual"
        else
          echo "::set-output name=version::skip"
        fi
    -
      name: Install
      if: ${{ steps.release.outputs.version != 'skip' }}
      run: npm ci
    -
      name: Node Version
      if: ${{ steps.release.outputs.version != 'skip' }}
      id: version
      run: |
        version="${{ steps.release.outputs.version }}"
        if [[ $version == "release" ]]; then
          result=$(npm pkg get version)
        else
          result=$(npm version ${{ steps.release.outputs.version }} --git-tag-version --allow-same-version)
          git push --tags
        fi
        git push origin HEAD:${{ gitea.event.pull_request.head.ref }}
        echo "::set-output name=number::$result"
#        git push origin HEAD:${{ gitea.event.pull_request.base.ref }}