name: Validation
run-name: ${{ gitea.actor }} is validating Vistta.JS
on:
  pull_request:
    branches:    
      - master
jobs:
  Validation-Actions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        
      - name: Print branch names
        run: |
          echo "Target/ref branch: ${{ gitea.ref }}"
          echo "Source/head_ref branch: ${{ gitea.head_ref }}"
          echo "Source/base_ref branch: ${{ gitea.base_ref }}"
          echo "${{ toJson(gitea.event.pull_request.labels.*.name) }}"
          echo "${{ toJson(gitea.event.pull_request) }}"