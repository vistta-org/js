Publish Node Release:
  image: node:latest
  stage: node_release
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^release:/i
      when: always
    - when: never
  script:
    - npm config set @vistta:registry https://git.vistta.me/api/packages/vistta/npm/
    - npm config set -- '//git.vistta.me/api/packages/vistta/npm/:_authToken' "9a62c99f1da9d4417fd2c396e5fba566a868bfbe"
    - npm publish

Publish Git Release:
  stage: git_release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_COMMIT_TITLE =~ /^patch:/i || $CI_COMMIT_TITLE =~ /^minor:/i || $CI_COMMIT_TITLE =~ /^major:/i)
      when: always
    - when: never
  script:
    - echo "Release $TAG"
  release:
    name: 'VisionJS $TAG - $CI_COMMIT_TITLE'
    description: 'VisionJS $TAG - $CI_COMMIT_TITLE'
    tag_name: '$TAG'
    ref: '$CI_COMMIT_SHA'
