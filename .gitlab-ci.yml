stages:
  - validate
  - node_patch
  - node_minor
  - node_major
  - node_release
  - git_release

Code Quality:
  image: node:latest
  stage: validate
  allow_failure: false
  script:
    - npm install
    - npm outdated
    - npm run checks
  only:
    refs:
      - merge_requests

Publish Node Patch:
  image: node:latest
  stage: node_patch
  allow_failure: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_COMMIT_TITLE =~ /^patch:/i
      when: always
    - when: never
  script:
    - git reset --hard
    - git config pull.rebase false
    - git config --global user.name "${DEVOPS_USER}"
    - git config --global user.email "${DEVOPS_EMAIL}"
    - git remote set-url origin "https://${DEVOPS_USER}:${DEVOPS_TOKEN}@${CI_REPOSITORY_URL#*@}"
    - git checkout -q ${CI_DEFAULT_BRANCH}
    - git pull
    - echo "TAG=$(npm version patch --git-tag-version --allow-same-version)" >> variables.env
    - npm config set @vistta:registry https://git.vistta.me/api/packages/vistta/npm/
    - npm config set -- '//git.vistta.me/api/packages/vistta/npm/:_authToken' "9a62c99f1da9d4417fd2c396e5fba566a868bfbe"
    - npm publish
    - git push origin ${TAG}
    - git push
    - git checkout -q ${CI_DEV_BRANCH}
    - git reset --hard origin/${CI_DEFAULT_BRANCH}
    - git push --force
  artifacts:
    reports:
      dotenv: variables.env

